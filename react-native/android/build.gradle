buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.4.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '2.4.20')}"
  }
}

apply plugin: "com.android.library"
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

android {
  namespace "org.traccar.reactnative"
  compileSdkVersion safeExtGet('compileSdkVersion', 37)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
  }
}

repositories {
  mavenCentral()
  google()
}

// Fork builds ship the SDK inside this package instead of on Maven Central. The
// app resolves it too, and only uses its own repositories, so add this one to all.
def bundledSdk = new File(projectDir, "maven")
if (bundledSdk.exists()) {
  rootProject.allprojects {
    repositories {
      maven {
        url = bundledSdk.toURI()
        content { includeGroup "org.traccar" }
      }
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.traccar:traccar-client-sdk:1.1.4"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
}
